id: SR-3
tags: [be]
title: Simple watcher plugin implementation
description: |
  The project should provide a simple file watcher. 
  The watcher plugin should implement API on stdin and stderr with the BE. 
  The watcher should read a yml or json config file for complex configurations, 
  but should provide simple and useful CLI arguments for simple configuration. 
  The watcher plugin should be able to start in standalone-CLI mode. where only the regenerate function is used.
  The watcher configuration:
  1. should regenerate on startup [boolean - default true]
  1. setup the a multiple watching-list of files and/or directories. 
    - [only for directories] [optional] should support multiple only-include patterns [glob and regex patterns].
    - [only for directories] [optional] should support multiple exclude patterns [glob and regex patterns].
    - [only for directories] recursive [boolean - default true]
    - [only for directories] recursive level limit [int - default 0(all levels)]
    - for each watching-list define what to do when a change is detected:
      - a list of generate command and arguments to run when changes are detected. PS: of course the FE part 
      from EWW should be also injected into web app. 
      - can the generation be interrupted [boolean - default true]
      - [optional] a command to execute if the generate process must be interrupted
  


